name: Bug report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please fill in every section so we can fix it quickly.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the problem.
      placeholder: Discount code gives the wrong total at checkout
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an item to the basket
        2. Apply a discount code
        3. Go to checkout
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      placeholder: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - customers can't buy
        - High - wrong result, no workaround
        - Medium - has a workaround
        - Low - cosmetic
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Where did it happen?
      multiple: true
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - Mobile app
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been reported yet
          required: truename: Bug report
